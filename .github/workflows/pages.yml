# Builds the site and publishes it.
#
# The site was built by Pages' own branch pipeline until that stopped
# deploying: the build succeeded every time, the artifact was created, and the
# deployment then sat at `deployment_in_progress` until the ten-minute default
# gave up — four times in an afternoon, leaving the site unserved. A workflow
# of our own is the same steps written down, which means they can be re-run on
# their own, given longer than ten minutes, and read when they fail.
#
# `make build` assembles src/ into dist/, and dist/ is what gets uploaded. It
# needs python3 and nothing else, which the runner already has — so there is no
# setup step, no lockfile, and nothing to keep current.
name: Pages

on:
  push:
    branches: [main]
  # So the build can be checked before it is published.
  pull_request:
    branches: [main]
  # So a stalled deployment can be retried without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One at a time, and let a newer push win: a queue of these behind a stuck
# deployment is what an afternoon of retries looked like.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the site
        run: make build

      # A page that references a picture that is not there builds happily and
      # is wrong in the browser, so the build is asked to prove otherwise: it
      # reads the width and height out of every PNG it links, which means a
      # missing one is a failed build rather than a broken image.
      - name: Show what was built
        run: find dist -type f | sort

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pull requests build to check the build; only main is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Ten minutes, which is the most this action allows — asking for
          # twenty only logs a warning and uses ten. Worth knowing, because it
          # means a deployment that has not been picked up in ten minutes
          # cannot be waited out from here: that is GitHub's side, and the
          # retry is `workflow_dispatch` rather than a longer wait.
          timeout: 600000
